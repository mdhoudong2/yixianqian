name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查（py_compile，不依赖第三方库）
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f" || { echo "语法错误: $f"; fail=1; }
          done < <(find bot web scripts lib -name '*.py' -print0 2>/dev/null)
          [ "$fail" -eq 0 ] || exit 1
          echo "所有 Python 文件语法检查通过"
      - name: 风格检查（ruff）
        run: |
          pip install -q ruff
          ruff check bot web lib --output-format=github || true
          echo "ruff 检查完成（当前仅提示，不阻断）"
      - name: 单测（pytest，如有 tests/ 目录）
        run: |
          if [ -d tests ] || ls -d **/test_*.py 2>/dev/null | grep -q .; then
            pip install -q pytest
            pytest -q || true
          else
            echo "无单测，跳过"
          fi
