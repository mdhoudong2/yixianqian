# test.nantou.love - 公开页（测试环境，proxy -> 8092 develop 后端）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name test.nantou.love;

    ssl_certificate /etc/letsencrypt/live/test.nantou.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.nantou.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS：强制浏览器走 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 公开页只在根路径，移除 /public.html 直接访问
    location = /public.html {
        return 301 https://test.nantou.love/;
    }

    # 根路径直接渲染公开页（由 Flask 注入测试环境二维码 qrcode_test.png）
    location = / {
        proxy_pass http://127.0.0.1:8092/public.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 引流埋点限流：同 IP 5次/秒，突发 10
    location /api/track {
        limit_req zone=track burst=10 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余走测试后端：lib/ 静态资源、qrcode、/api/*
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name test.nantou.love;

    location /.well-known/acme-challenge/ {
        root /var/www/nantou.love;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
