  .like-dialog-body { padding: 16px; }
  .like-notes { color: #969799; font-size: 12px; line-height: 1.7; margin-bottom: 12px; }
  .like-note-highlight { color: #ff6b81; font-weight: 600; }
  .feedback-radio-group .van-radio { margin-bottom: 14px; }
  .feedback-radio-group .van-radio:last-child { margin-bottom: 0; }
  .like-textarea { background: #f7f8fa; border-radius: 8px; padding: 8px 10px; }
  .like-realname-warn { color: #ed6a0c; font-size: 12px; line-height: 1.6; margin: 4px 0 10px; background: #fff7e6; border-radius: 6px; padding: 6px 10px; }
  /* 邀请好友弹窗 */
  .invite-dialog-body { padding: 16px; }
  .invite-dialog-body p { font-size: 13px; color: #646566; line-height: 1.6; margin-bottom: 12px; }
  .invite-link-box { background: #f7f8fa; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #323233; word-break: break-all; margin-bottom: 14px; line-height: 1.6; }
  /* 我的页-邀请入口 */
  .invite-close { position: absolute; top: 10px; right: 14px; font-size: 20px; color: #c8c9cc; cursor: pointer; z-index: 2; }
  .profile-cells .van-cell { font-size: 16px; }
  .admin-help-panel { padding: 20px 16px 16px; }
  .admin-help-title { font-size: 17px; font-weight: 600; color: #323233; text-align: center; margin-bottom: 16px; }
  .admin-help-list { max-height: 55vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .admin-help-cat { font-size: 13px; font-weight: 600; color: #ff6b81; padding: 12px 2px 6px; }
  .admin-help-cat:first-child { padding-top: 0; }
  .admin-help-item { font-size: 14px; color: #323233; line-height: 1.5; padding: 10px 12px; background: #f7f8fa; border-radius: 8px; margin-bottom: 10px; word-break: break-all; }
  .admin-help-item:last-child { margin-bottom: 0; }
  .admin-help-close { margin-top: 16px; text-align: center; font-size: 15px; color: #ff6b81; padding: 10px; cursor: pointer; }
  /* 活动海报可点击 */
  .activity-poster.clickable { cursor: zoom-in; }
  /* 图片查看器左右切换 */
  .photo-viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(0,0,0,0.4); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; z-index: 1000; }
  .photo-viewer-nav.prev { left: 12px; }
  .photo-viewer-nav.next { right: 12px; }
  /* 报名名单 */
  .signup-sheet-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .signup-sheet-avatar { width: 44px; height: 44px; border-radius: 50%; background: #fff0f3; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; flex-shrink: 0; }
  .signup-sheet-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .signup-sheet-name { font-size: 16px; color: #323233; }
  /* 他人资料页 */
  .user-detail-card { padding: 12px; }
  .ud-photo { width: 120px; height: 120px; border-radius: 50%; margin: 20px auto; background: #fff0f3; display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; cursor: pointer; }
  .ud-photo img { width: 100%; height: 100%; object-fit: cover; }
  .ud-name { text-align: center; font-size: 20px; font-weight: bold; color: #323233; }
  .ud-name .gender-icon { font-size: 16px; margin-left: 6px; }
  /* 消息-动态（已并入 msg-card） */
  /* 筛选 */
  .filter-btn { position: absolute; top: 12px; right: 16px; background: rgba(0,0,0,0.4); color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 13px; z-index: 6; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .filter-btn.active { background: #ff6b81; }
  .filter-row { margin-bottom: 22px; }
  .filter-label { font-size: 14px; color: #323233; font-weight: 500; margin-bottom: 6px; }
  .filter-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-tag { padding: 5px 14px; border-radius: 16px; background: #f2f3f5; color: #646566; font-size: 13px; cursor: pointer; }
  .filter-tag.active { background: #ff6b81; color: #fff; }
  .filter-input { padding: 6px 10px; background: #f7f8fa; border-radius: 8px; }
  /* 卡片留言 */
  .card-tabs { display: flex; flex-shrink: 0; background: #fff; padding: 0 16px; border-bottom: 1px solid #f2f3f5; }
  .card-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 15px; font-weight: 500; color: #969799; cursor: pointer; position: relative; }
  .card-tab.active { color: #ff6b81; font-weight: 600; }
  .card-tab.active::after { content: ''; position: absolute; left: 50%; transform: translateX(-50%); bottom: -1px; width: 32px; height: 3px; border-radius: 2px; background: #ff6b81; }
  .msg-count-badge { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px; margin-left: 4px; border-radius: 8px; background: #ff6b81; color: #fff; font-size: 11px; font-weight: 600; vertical-align: 1px; }
  .message-panel { display: flex; flex-direction: column; height: 100%; }
  .msg-tip { padding: 30px 0; text-align: center; color: #969799; font-size: 14px; }
  .msg-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .msg-thread { border-bottom: 1px solid #f7f8fa; padding-bottom: 8px; margin-bottom: 8px; }
  .msg-item { padding: 6px 0; }
  .msg-reply { margin-left: 12px; padding-left: 10px; border-left: 2px solid #ffe3e8; }
  .msg-head { display: flex; align-items: center; gap: 8px; }
  .msg-avatar-sm { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #fff0f3; }
  .msg-avatar-sm-fallback { display: flex; align-items: center; justify-content: center; color: #ff6b81; font-size: 14px; font-weight: 600; }
  .msg-author { font-size: 13px; font-weight: 600; color: #ff6b81; }
  .msg-time { font-size: 11px; color: #c8c9cc; }
  .msg-del { font-size: 12px; color: #969799; cursor: pointer; }
  .msg-report { font-size: 12px; color: #ee0a24; cursor: pointer; margin-left: 6px; }
  .msg-report:active { opacity: 0.7; }
  .msg-foot { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
  .reported-msg-content { background:#fff0f3; color:#323233; padding:6px 10px; border-radius:8px; margin-top:6px; white-space:normal; word-break:break-word; }
  .van-theme-dark .reported-msg-content { background: rgba(255,107,129,0.18); color:#f5f5f5; }
  .reported-status-pending { color:#ff6b81; font-size:12px; }
  .reported-status-done { color:#969799; font-size:12px; }
  .msg-content { font-size: 14px; color: #323233; margin-top: 4px; word-break: break-word; white-space: pre-wrap; }
  .msg-reply-btn { font-size: 12px; color: #969799; cursor: pointer; }
  .msg-reply-tag { color: #c8c9cc; font-size: 13px; }
  .msg-reply-target { color: #ff6b81; font-weight: 600; }
  .msg-reply-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 0; font-size: 12px; color: #ff6b81; }
  .msg-reply-cancel { color: #969799; cursor: pointer; }
  .msg-input-bar { display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid #f2f3f5; }
  .msg-input { flex: 1; border: none; background: #f7f8fa; border-radius: 18px; padding: 8px 14px; font-size: 14px; outline: none; }
  .msg-send { border: none; background: #ff6b81; color: #fff; border-radius: 18px; padding: 0 18px; font-size: 14px; cursor: pointer; }
  .msg-send:disabled { background: #ffb3be; }
  /* 通用小类（供内联样式替换用） */
  .msg-sub-strong { color: #323233; }
  .detail-meta { font-size: 14px; color: #646566; line-height: 2; }
  .candidate-search-box { background: #fff; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
  .candidate-search-input { width: 100%; padding: 8px 12px; border: 1px solid #ebedf0; border-radius: 16px; font-size: 14px; color: #323233; box-sizing: border-box; outline: none; background: #fff; }
  .sheet-title { font-size: 16px; font-weight: 500; text-align: center; margin-bottom: 8px; color: #323233; }
  .filter-title { font-size: 17px; font-weight: 600; color: #323233; }
  .modal-card { width: 100%; background: #fff; border-radius: 14px; overflow: hidden; }
  .modal-title { font-size: 16px; font-weight: 600; color: #323233; margin-bottom: 8px; }
  .modal-body { font-size: 14px; color: #646566; }
  .modal-divider { border-top: 1px solid #ebedf0; }
  .modal-action { text-align: center; padding: 14px; font-size: 15px; cursor: pointer; color: #646566; }
  .modal-action-muted { color: #969799; }
  .modal-action-primary { color: #ff6b81; font-weight: 600; }
  /* 夜间模式 */
  .van-theme-dark { --van-background: #1a1a1c; --van-background-2: #222226; --van-background-3: #2c2c30; --van-border-color: #3a3a3e; --van-active-color: #3a3a3e; --van-field-placeholder-text-color: #8a8a8e; }
  .van-theme-dark html, .van-theme-dark body, html.van-theme-dark, html.van-theme-dark body { background: #1a1a1c; color: #f5f5f5; }
  .van-theme-dark .activity-card, .van-theme-dark .swipe-card, .van-theme-dark .msg-card,
  .van-theme-dark .profile-card, .van-theme-dark .profile-section-card, .van-theme-dark .edit-card,
  .van-theme-dark .like-item, .van-theme-dark .group-candidate, .van-theme-dark .selected-list,
  .van-theme-dark .group-member, .van-theme-dark .back-nav, .van-theme-dark .card-tabs,
  .van-theme-dark .feedback-btn, .van-theme-dark .back-btn, .van-theme-dark .edit-photo-add-btn,
  .van-theme-dark .modal-card { background: #222226; }
  .van-theme-dark .activity-poster, .van-theme-dark .card-photo-wrap { background: #2c2c30; }
  .van-theme-dark .activity-card h3, .van-theme-dark .info-section-content, .van-theme-dark .info-grid-item,
  .van-theme-dark .info-grid-item .df-value, .van-theme-dark .msg-name, .van-theme-dark .msg-content,
  .van-theme-dark .profile-card-row, .van-theme-dark .invite-code-inline, .van-theme-dark .profile-section-title,
  .van-theme-dark .selected-list h4, .van-theme-dark .choice-name, .van-theme-dark .group-member-name,
  .van-theme-dark .like-item-name, .van-theme-dark .ud-name, .van-theme-dark .login-title,
  .van-theme-dark .back-nav, .van-theme-dark .edit-picker, .van-theme-dark .picker-option,
  .van-theme-dark .multi-option, .van-theme-dark .admin-help-title, .van-theme-dark .admin-help-item,
  .van-theme-dark .signup-sheet-name, .van-theme-dark .filter-label, .van-theme-dark .invite-link-box,
  .van-theme-dark .modal-title, .van-theme-dark .sheet-title, .van-theme-dark .msg-sub-strong,
  .van-theme-dark .candidate-search-input, .van-theme-dark .filter-title { color: #f5f5f5; }
  .van-theme-dark .activity-desc, .van-theme-dark .msg-message, .van-theme-dark .edit-label,
  .van-theme-dark .round-tab, .van-theme-dark .invite-dialog-body p, .van-theme-dark .filter-tag,
  .van-theme-dark .like-item-msg, .van-theme-dark .modal-body, .van-theme-dark .detail-meta,
  .van-theme-dark .modal-action { color: #c8c9cc; }
  .van-theme-dark .msg-message, .van-theme-dark .like-item-msg, .van-theme-dark .invite-link-box,
  .van-theme-dark .msg-input, .van-theme-dark .filter-input, .van-theme-dark .like-textarea,
  .van-theme-dark .admin-help-item, .van-theme-dark .multi-option, .van-theme-dark .filter-tag,
  .van-theme-dark .round-tab, .van-theme-dark .candidate-search-box { background: #2c2c30; }
  .van-theme-dark .info-tag, .van-theme-dark .msg-avatar, .van-theme-dark .msg-avatar-sm,
  .van-theme-dark .profile-photo-placeholder, .van-theme-dark .group-member-avatar,
  .van-theme-dark .like-item-avatar, .van-theme-dark .ud-photo, .van-theme-dark .signup-sheet-avatar,
  .van-theme-dark .selected-item, .van-theme-dark .choice-item,
  .van-theme-dark .multi-option.active { background: rgba(255,107,129,0.14); }
  .van-theme-dark .profile-card-divider { background: #3a3a3e; }
  .van-theme-dark .edit-row, .van-theme-dark .signup-bar,
  .van-theme-dark .card-tabs, .van-theme-dark .picker-header, .van-theme-dark .msg-input-bar,
  .van-theme-dark .back-nav, .van-theme-dark .msg-thread, .van-theme-dark .modal-divider { border-color: #3a3a3e; }
  .van-theme-dark .msg-reply { border-left-color: rgba(255,107,129,0.35); }
  .van-theme-dark .msg-reply-target { color: #ff8fa1; }
  .van-theme-dark .msg-reply-tag { color: #8c8d91; }
  .van-theme-dark .msg-reply-btn { color: #6e6f73; }
  .van-theme-dark .feedback-btn, .van-theme-dark .back-btn { border-color: #4a4a4e; }
  .van-theme-dark .profile-photo-section img { border-color: #3a3a3e; }
  .van-theme-dark .msg-input { color: #f5f5f5; }
  .van-theme-dark .candidate-search-input { background: #1a1a1c; border-color: #3a3a3e; }
  .van-theme-dark .msg-input::placeholder, .van-theme-dark .candidate-search-input::placeholder { color: #a0a0a4; }
  .van-theme-dark .edit-tip { background: #2b2413; color: #e8c97a; }
  .van-theme-dark .like-realname-warn { background: #2b2413; color: #f0a25c; }
  /* 选中态：暗色覆盖不能吞掉 active 的粉色反馈 */
  .van-theme-dark .filter-tag.active, .van-theme-dark .round-tab.active { background: #ff6b81; color: #fff; }
  .van-theme-dark .picker-option.active, .van-theme-dark .multi-option.active { color: #ff6b81; }
  .van-theme-dark .multi-option.active { background: rgba(255,107,129,0.14); }
  /* 四 Tab 间流畅过渡 */
  .tab-main { position: relative; min-height: calc(100vh - 60px); }
  .tab-transition-enter-active { transition: opacity 0.10s ease, transform 0.10s cubic-bezier(0.32,0.72,0,1); will-change: opacity, transform; }
  .tab-transition-leave-active { transition: opacity 0.08s ease, transform 0.08s ease; will-change: opacity, transform; }
  .tab-transition-enter-from { opacity: 0; transform: translateY(6px); }
  .tab-transition-leave-to { opacity: 0; transform: translateY(-3px); }
  .tab-slide-left-enter-active { transition: opacity 0.12s ease, transform 0.12s cubic-bezier(0.32,0.72,0,1); will-change: opacity, transform; }
  .tab-slide-left-leave-active { transition: opacity 0.08s ease, transform 0.08s ease; will-change: opacity, transform; }
  .tab-slide-left-enter-from { opacity: 0; transform: translateX(12px); }
  .tab-slide-left-leave-to { opacity: 0; transform: translateX(-12px); }
  .tab-slide-right-enter-active { transition: opacity 0.12s ease, transform 0.12s cubic-bezier(0.32,0.72,0,1); will-change: opacity, transform; }
  .tab-slide-right-leave-active { transition: opacity 0.08s ease, transform 0.08s ease; will-change: opacity, transform; }
  .tab-slide-right-enter-from { opacity: 0; transform: translateX(-12px); }
  .tab-slide-right-leave-to { opacity: 0; transform: translateX(12px); }
  .page-slide-enter-active { transition: opacity 0.14s ease, transform 0.14s cubic-bezier(0.32,0.72,0,1); will-change: opacity, transform; }
  .page-slide-leave-active { transition: opacity 0.08s ease, transform 0.08s ease; will-change: opacity, transform; }
  .page-slide-enter-from { opacity: 0; transform: translateX(20px); }
  .page-slide-leave-to { opacity: 0; transform: translateX(-12px); }
  .page-slide-back-enter-active { transition: opacity 0.12s ease, transform 0.12s cubic-bezier(0.32,0.72,0,1); will-change: opacity, transform; }
  .page-slide-back-leave-active { transition: opacity 0.08s ease, transform 0.08s ease; will-change: opacity, transform; }
  .page-slide-back-enter-from { opacity: 0; transform: translateX(-18px); }
  .page-slide-back-leave-to { opacity: 0; transform: translateX(12px); }
  @media (prefers-reduced-motion: reduce) {
    .tab-transition-enter-active, .tab-transition-leave-active,
    .tab-slide-left-enter-active, .tab-slide-left-leave-active,
    .tab-slide-right-enter-active, .tab-slide-right-leave-active,
    .page-slide-enter-active, .page-slide-leave-active,
    .page-slide-back-enter-active, .page-slide-back-leave-active { transition: none !important; }
  }
</style>
</head>
<body>
<div id="app">
<!-- 登录中 -->
<div v-if="loggingIn" class="login-page">
  <div class="login-logo">💕</div>
  <van-loading size="24px">正在登录...</van-loading>
</div>
<!-- 未登录 -->
<div v-else-if="!user && !gateMessage" class="login-page">
  <div class="login-logo">💕</div>
  <div class="login-title">一线牵</div>
  <div class="login-desc">真实、纯粹的交友平台<br>请在飞书中搜索"一线牵"机器人<br>从机器人进入使用</div>
  <div v-if="loginError" style="color:#ee0a24;font-size:13px;margin-bottom:16px;padding:0 20px;">{{ loginErrorMessage || '登录失败，请重试' }}</div>
  <van-button type="primary" color="#ff6b81" @click="retryLogin" v-if="loginError">重新登录</van-button>
</div>
<!-- 账号状态门禁（待审核/已退出） -->
<div v-else-if="gateMessage" class="login-page">
  <div class="login-logo">{{ gateIcon }}</div>
  <div class="login-title">{{ gateTitle }}</div>
  <div class="login-desc">{{ gateMessage }}<br>如有疑问请联系管理员</div>
  <van-button plain type="primary" color="#969799" style="margin-top:16px;" @click="retryGate">刷新重试</van-button>
</div>
<!-- 主界面 -->
<template v-else>
<Transition :name="pageTransition" mode="out-in">
<!-- ========== 牵线页 ========== -->
<div v-if="page==='cards'" key="cards" class="cards-page">
  <div v-if="loadingCards" style="display:flex; align-items:center; justify-content:center; height:100%;">
    <van-loading size="24px">加载中...</van-loading>
  </div>
  <template v-else>
    <div class="card-top-left">
      <div class="card-counter">{{ cards.length ? (cardIndex + 1) + ' / ' + (cardsTotal || cards.length) : '0 / 0' }}</div>
      <div class="hearts-badge" v-if="!isObserver">💕 {{ user.hearts }}</div>
    </div>
    <div class="filter-btn" :class="{active: hasActiveFilter}" @click="showFilter=true">⚙ 筛选</div>
    <van-empty v-if="!cards.length" :description="hasActiveFilter ? '没有符合筛选条件的人，试试调整筛选' : '暂时没有可推荐的人了～'"></van-empty>
    <template v-else>
    <div v-if="currentCard" class="swipe-card" :key="cardIndex"
      :class="slideDir === 'right' ? 'slide-in-right' : (slideDir === 'left' ? 'slide-in-left' : '')">
      <div class="card-photo-wrap" @touchstart="onPhotoTouchStart" @touchmove="onPhotoTouchMove" @touchend="onPhotoTouchEnd" @mousedown="onPhotoMouseDown" @mousemove="onPhotoMouseMove" @mouseup="onPhotoMouseUp" @mouseleave="onPhotoMouseLeave" @click="onPhotoClick">
        <div v-if="photoLoading" class="photo-loading"></div>
        <div v-if="currentPhotoList.length" class="card-photo-track" :style="{ transform: 'translateX(-' + photoIndex * 100 + '%)' }">
          <img v-for="(p,i) in currentPhotoList" :key="i" :src="p" class="card-photo-item" alt=""
            :style="photoPositions[i] ? { objectPosition: photoPositions[i] } : null"
            @load="onPhotoLoad($event); recalcPhotoPosition($event, i)" @error="onPhotoError">
        </div>
        <div v-else class="card-photo-placeholder">{{ currentCard.gender==='男性' ? '👨' : '👩' }}</div>
        <div class="photo-dots" v-if="currentCard.photos && currentCard.photos.length > 1">
          <div v-for="(p,i) in currentCard.photos" :key="i" class="photo-dot" :class="{active: i===photoIndex}"></div>
        </div>
        <div class="card-photo-overlay">
          <div class="card-overlay-box">
            <div class="card-overlay-text">
              <div v-if="currentCard.is_self" style="margin-bottom:6px;"><span style="background:#ff6b81;color:#fff;font-size:11px;padding:3px 9px;border-radius:999px;">这是你 · 他人视角</span></div>
              <div class="card-name">{{ currentCard.nickname }}
                <span class="gender-icon">{{ currentCard.gender==='男性' ? '♂' : '♀' }}</span>
              </div>
              <div class="card-subtitle" v-if="currentCard.display_fields && currentCard.display_fields.simple">{{ currentCard.display_fields.simple }}</div>
            </div>

          </div>
        </div>
      </div>
      <div class="card-main" @touchstart="onCardTouchStart" @touchmove="onCardTouchMove" @touchend="onCardTouchEnd" @mousedown="onCardMouseDown" @mousemove="onCardMouseMove" @mouseup="onCardMouseUp" @mouseleave="onCardMouseLeave">
      <div class="card-tabs">
        <div class="card-tab" :class="{active: cardTab==='profile'}" @click="cardTab='profile'">资料</div>
        <div v-if="!currentCard.is_self" class="card-tab" :class="{active: cardTab==='messages'}" @click="openMessageTab">留言<span v-if="currentMsgCount > 0" class="msg-count-badge">{{ currentMsgCount }}</span></div>
      </div>
      <div class="card-info">
        <template v-if="cardTab==='profile'">
          <template v-if="currentCard.display_fields && currentCard.display_fields.sections">
            <div class="card-section" v-for="(sec, si) in currentCard.display_fields.sections" :key="si">
              <div class="profile-section-title"><span class="ps-icon">{{ sec.icon }}</span>{{ sec.title }}</div>
              <div class="info-grid">
                <div class="info-grid-item" v-for="f in sec.fields" :key="f.label"
                  :class="{full: f.label==='我是怎样的人' || f.label==='理想中的TA'}">
                  <span class="df-label">{{ f.label }}：</span>
                  <span class="df-value">{{ f.value }}</span>
                </div>
              </div>
            </div>
          </template>
        </template>

                  <span class="msg-reply-btn" @click.stop="replyTo(r, m)">回复</span>
                </div>

            </div>

        </div>
      </div>
    </div>
      </div>

<script>
// anti-copy: disable text selection and long-press save on images
(function(){
  try{
    function isEditable(el){
      try{
        if(!el) return false;
        if(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.isContentEditable) return true;
        if(el.closest && el.closest('input, textarea, [contenteditable="true"], [contenteditable=""]')) return true;
        var p=el.parentElement;
        while(p){
          if(p.tagName==='INPUT'||p.tagName==='TEXTAREA'||p.isContentEditable) return true;
          p=p.parentElement;
        }
      }catch(e){}
      return false;
    }
    document.addEventListener('contextmenu', function(e){ if(isEditable(e.target)) return; e.preventDefault(); });
    document.addEventListener('selectstart', function(e){ if(isEditable(e.target)) return; e.preventDefault(); });
    document.addEventListener('copy', function(e){ if(isEditable(e.target)) return; e.preventDefault(); });
    document.addEventListener('cut', function(e){ if(isEditable(e.target)) return; e.preventDefault(); });
    document.addEventListener('dragstart', function(e){ e.preventDefault(); });
    function disableImgDrag(){
      document.querySelectorAll('img').forEach(function(img){ img.setAttribute('draggable','false'); });
    }
    if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', disableImgDrag); } else { disableImgDrag(); }
    new MutationObserver(disableImgDrag).observe(document.documentElement,{childList:true,subtree:true});
  }catch(e){}
})();
const { createApp, ref, computed, onMounted, watch, nextTick } = Vue;
createApp({
  setup() {
    const page = ref('cards');
    // 四 Tab / 子页流畅过渡：按 tab 顺序与子页层级自动选动画
    const pageTransition = ref('tab-transition');
    const TAB_ORDER = ['cards','likes','home','profile'];
    function pickTransition(nv, ov){
      if(!ov) return 'tab-transition';
      const isTab = p => TAB_ORDER.includes(p);
      const isSub = p => subPages.includes(p);
      if(isTab(nv) && isTab(ov)){
        return TAB_ORDER.indexOf(nv) > TAB_ORDER.indexOf(ov) ? 'tab-slide-left' : 'tab-slide-right';
      }
      if(isSub(nv) && !isSub(ov)) return 'page-slide';
      if(!isSub(nv) && isSub(ov)) return 'page-slide-back';
      if(isSub(nv) && isSub(ov)) return 'page-slide';
      return 'tab-transition';
    }
    // 夜间模式（默认日间）
    const isDark = ref(false);
    try { isDark.value = localStorage.getItem('yxq_dark') === '1'; } catch(e) {}
    function toggleTheme(){
      isDark.value = !isDark.value;
      document.documentElement.classList.toggle('van-theme-dark', isDark.value);
      try { localStorage.setItem('yxq_dark', isDark.value ? '1' : '0'); } catch(e) {}
    }
    document.documentElement.classList.toggle('van-theme-dark', isDark.value);
    // —— 返回拦截（飞书手势/物理返回）——
    let isHandlingPopState = false;
    let ignoreNextPop = false;
    function pushHistory(state){
      if(isHandlingPopState) return;
      try{ history.pushState(state, '', location.pathname + '#' + (state.page || state.overlay || 'h5')); }catch(e){}
    }
    function handleBack(){
      // 修改资料有未保存改动：弹保存提醒
      if(page.value === 'profile_edit' && isProfileEditDirty()){
        pendingProfileEditLeave = () => { history.back(); };
        showUnsavedConfirm.value = true;
        return;
      }
      if(showUnsavedConfirm.value){
        cancelProfileEditLeave();
        return;
      }
      // 统一返回：有浮层先关浮层，无则 history.back() 让 popstate 处理页面
      if(showPhotoViewer.value || showFilter.value || showLikeDialog.value || showFeedbackDialog.value || showReportDialog.value || showSuggestionDialog.value || showInviteDialog.value || showAdminHelp.value || showSelectPopup.value || showMultiPopup.value || signupSheetShow.value){
        history.back();
        return;
      }
      if(page.value !== 'cards' && page.value !== 'home' && page.value !== 'likes' && page.value !== 'profile'){
        history.back();
        return;
      }
      // 主Tab下直接返回由容器处理（关闭网页）
      history.back();
    }
    const user = ref(null);
    const isObserver = computed(() => !!(user.value && user.value.is_observer));
    const availableRoles = computed(() => (user.value && user.value.available_roles) || []);
    const loggingIn = ref(true);
    const loginError = ref(false);
    const loginErrorMessage = ref('');
    // 账号状态门禁（待审核/审核不通过/已退出）：后端 /api/home 返回 403 时整屏提示
    const gateMessage = ref('');
    const gateTitle = computed(() => {
      const m = gateMessage.value;
      if (m.includes('审核中')) return '资料审核中';
      if (m.includes('未通过审核')) return '未通过审核';
      return '账号已退出';
    });
    const gateIcon = computed(() => {
      const m = gateMessage.value;
      if (m.includes('审核中')) return '⏳';
      if (m.includes('未通过审核')) return '💔';
      return '🚪';

    const photoPositions = ref([]);
    function recalcPhotoPosition(e, i, attempt) {
      attempt = attempt || 0;
      try {
        const f = (currentCard.value.faces || [])[i];
        const img = e.target;
        if (!f || !f.c || !img || !img.naturalWidth) return;
        const wrap = img.closest('.card-photo-wrap');
        if (!wrap) return;
        const cw = wrap.clientWidth, ch = wrap.clientHeight;
        const iw = img.naturalWidth, ih = img.naturalHeight;
        if (!cw || !ch) {
          // 真机缓存图 @load 可能早于首帧布局，容器尺寸未就绪 → 稍后重试
          if (attempt < 8) setTimeout(() => recalcPhotoPosition(e, i, attempt + 1), 120);
          return;
        }
        if (!iw || !ih) return;
        const scale = Math.max(cw / iw, ch / ih);
        const dh = ih * scale;
        // 黑边：上下无用区比例，等效到「内容区坐标系」内计算，显示时把黑边排除出可视区
        const tb = (f.tb && f.tb.length === 2) ? f.tb : [0, 0];
        const ct = tb[0], cb = tb[1];
        const cr = 1 - ct - cb;             // 内容区占原图高比例
        if (cr < 0.55) return;              // 有效内容过少（异常），放弃
        const eh = dh * cr;                 // 内容区显示高度
        const cy_e = (f.c[1] - ct) / cr;    // 脸中心在内容区坐标
        const fh = (f.box && f.box[1]) ? f.box[1] : 0;
        const fh_e = fh / cr;
        let off_e;                          // 内容区顶相对容器顶的偏移
        if (eh <= ch + 1) {
          off_e = (ch - eh) / 2;            // 内容区完整可见：内容区居中（黑边照片必须调整，否则露黑边）
        } else {
          const top_e = (cy_e - fh_e / 2) * eh;
          const bottom_e = (cy_e + fh_e / 2) * eh;
          const headTop_e = top_e - fh_e * 0.35 * eh; // 头顶（框顶上方留 35% 框高=头发+留白）
          const offDef_e = (ch - eh) / 2;
          // 内容区内「头顶~下巴」完整可见 → 内容区居中即可
          if (offDef_e + headTop_e >= 0 && offDef_e + bottom_e <= ch) off_e = offDef_e;
          else if (offDef_e + headTop_e < 0) off_e = -headTop_e;       // 头顶被裁 → 上移
          else if (offDef_e + bottom_e > ch) off_e = ch - bottom_e;    // 下巴被裁 → 下移
          else off_e = offDef_e;
          off_e = Math.max(ch - eh, Math.min(0, off_e));

        let off = off_e - ct * dh;          // 换算回原图偏移

        const offDef = (ch - dh) / 2;

    function getFeishuSilentCode() {

        // 等待JSSDK加载（最多等3秒）
        let waited = 0;
        const tryGetCode = () => {
          const tt = window.tt || window.h5sdk;
          if (!tt) {
            if (waited < 3000) { waited += 200; setTimeout(tryGetCode, 200); return; }
            resolve({code: null, error: 'JSSDK未加载'}); return;
          }
          // 优先用 requestAuthCode（兼容性最好），失败再试 requestAccess
          if (typeof tt.requestAuthCode === 'function') {
            tt.requestAuthCode({
              appId: FEISHU_APP_ID,
              success: (res) => resolve({code: (res && res.code) ? res.code : null, error: null}),
              fail: (err) => {
                if (typeof tt.requestAccess === 'function') {
                  tt.requestAccess({
                    appID: FEISHU_APP_ID,
                    scopeList: [],
                    success: (res2) => resolve({code: (res2 && res2.code) ? res2.code : null, error: null}),
                    fail: (err2) => resolve({code: null, error: JSON.stringify(err2)})
                  });
                } else {
                  resolve({code: null, error: JSON.stringify(err)});
                }
              }
            });
          } else if (typeof tt.requestAccess === 'function') {
            tt.requestAccess({
              appID: FEISHU_APP_ID,
              scopeList: [],
              success: (res) => resolve({code: (res && res.code) ? res.code : null, error: null}),
              fail: (err) => resolve({code: null, error: JSON.stringify(err)})

      const f = filter.value;

      if (nick) parts.push('nickname=' + encodeURIComponent(nick));

      ['age_min','age_max'].forEach(k => { if (f[k] !== '') parts.push(k + '=' + encodeURIComponent(f[k])); });

    async function handleReported(m, action) {
      const isDelete = action === 'delete';
      const title = isDelete ? '确认同意举报' : '确认驳回举报';
      const message = isDelete ? '确定删除该留言？一级留言将连带删除其下回复。' : '确定驳回举报并恢复该留言？';
      try {
        await vant.showConfirmDialog({ title, message, confirmButtonColor: isDelete ? '#ee0a24' : '#1989fa' });
      } catch(e) { return; }
      // 乐观更新：立即在界面上标记为已处理
      const backup = JSON.parse(JSON.stringify(reportedMessages.value));
      const backupCount = reportedCount.value;
      const backupMessages = JSON.parse(JSON.stringify(messages.value));
      const backupMsgCount = cards.value[cardIndex.value] ? cards.value[cardIndex.value].msg_count : null;
      const now = Date.now();
      // 更新举报管理列表中该条状态
      const idx = reportedMessages.value.findIndex(x => x.id === m.id);
      if (idx !== -1) {
        reportedMessages.value[idx] = { ...reportedMessages.value[idx], status: isDelete ? '已同意' : '已驳回', handled_at: now, action };
        // 保持举报时间倒序：已处理的按原 report_time 排序，不重排即可；徽标仅计待处理
        reportedCount.value = reportedMessages.value.filter(x=>x.status==='待处理').length;
      }
      // 同步更新当前卡片留言列表（乐观）
      if (isDelete) {
        messages.value = messages.value.filter(x => x.id !== m.id && x.parent_id !== m.id);
        if (cards.value[cardIndex.value]) cards.value[cardIndex.value].msg_count = messages.value.length;
      } else {
        // 驳回：若在当前卡片，尝试乐观恢复（若之前因举报隐藏，重新拉取更准，但先乐观）
        if (cards.value[cardIndex.value] && cards.value[cardIndex.value].openid === m.target_openid) {
          // 标记需要刷新，待接口成功后静默刷新
        }
      }
      try {
        await api('/api/messages/' + m.id + '/handle', {
          method: 'POST',
          body: JSON.stringify({ action: isDelete ? 'delete' : 'approve' })
        });
        vant.showToast(isDelete ? '已删除' : '已驳回');
        // 驳回成功后若在当前卡片，刷新以显示恢复的留言（不整页重载，仅刷新留言列表）
        if (!isDelete && cards.value[cardIndex.value] && cards.value[cardIndex.value].openid === m.target_openid) {
          msgLoadedFor = null;
          try { await loadMessages(true); } catch(e){}
        }
        // 后台静默对账：不强制重拉举报列表，保持乐观结果（历史已在本地）
      } catch(e) {
        // 失败回滚
        reportedMessages.value = backup;
        reportedCount.value = backupCount;
        messages.value = backupMessages;
        if (cards.value[cardIndex.value] && backupMsgCount !== null) cards.value[cardIndex.value].msg_count = backupMsgCount;
        vant.showToast(e.message || '操作失败');
      }
    }

        } else {
          myLikesList.value = serverList;
          myLikesCount.value = serverList.length;
        }
        myLikesLoaded.value = true;
      } catch(e) { vant.showToast(e.message); }

        // rollback on failure
        myLikesList.value = backupList;
        myLikesCount.value = backupCount;

        if (backupJustLiked) justLiked.add(l.openid);

    }

    function fmtTimeAgo(ts) {
      if (!ts) return '';
      const diff = Date.now() - ts;
      const m = Math.floor(diff / 60000);
      if (m < 1) return '刚刚';
      if (m < 60) return m + '分钟前';
      const h = Math.floor(m / 60);
      if (h < 24) return h + '小时前';
      const d = Math.floor(h / 24);
      if (d < 30) return d + '天前';
      const dt = new Date(ts);
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');

    async function sendMessage() {
      if (msgSending.value) return;
      const c = currentCard.value;
      const text = msgText.value.trim();
      if (!text) { vant.showToast('请先输入留言内容'); return; }
      if (!c || !c.openid) { vant.showToast('卡片信息异常，请左右切换到其他用户后重试'); return; }
      const parentId = replyTarget.value ? (replyTarget.value.parentId || replyTarget.value.id) : '';
      const replyToId = replyTarget.value ? replyTarget.value.id : '';
      const replyToNickname = replyTarget.value ? replyTarget.value.author_nickname : '';
      const replyToUid = replyTarget.value ? replyTarget.value.author_uid : '';
      const tempId = 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const now = Date.now();
      const tempMsg = {
        id: tempId,
        author_nickname: (user.value && user.value.nickname) || '我',
        author_uid: (user.value && user.value.user_id) || '',
        author_avatar: (user.value && user.value.photo) || '',
        content: text,
        parent_id: parentId,
        reply_to_id: replyToId,
        reply_to_nickname: replyToNickname,
        reply_to_uid: replyToUid,
        created_at: now,
        is_mine: true,
        can_delete: true,
        _optimistic: true,
      };
      const savedText = text;
      const savedReply = replyTarget.value;
      // optimistic: immediate render
      messages.value = [...messages.value, tempMsg];
      if (cards.value[cardIndex.value]) cards.value[cardIndex.value].msg_count = messages.value.length;
      msgText.value = '';
      replyTarget.value = null;
      // scroll to bottom so user sees own message
      nextTick(() => {
        try {
          const el = document.querySelector('.msg-list');
          if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
        } catch (_) {}
      });
      msgSending.value = true;
      let realId = null;
      try {
        const data = await api('/api/messages', {
          method: 'POST',
          body: JSON.stringify({ target_openid: c.openid, content: savedText, parent_id: parentId, reply_to_id: replyToId })
        });
        realId = data && data.id;
        if (realId) {
          const idx = messages.value.findIndex(m => m.id === tempId);
          if (idx >= 0) messages.value[idx] = { ...messages.value[idx], id: realId, _optimistic: false };
        }
        // keep msg_count in sync (no reload)
        if (cards.value[cardIndex.value]) cards.value[cardIndex.value].msg_count = messages.value.length;
        vant.showToast('留言成功');
        nextTick(() => {
          try {
            const el = document.querySelector('.msg-list');
            if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
          } catch (_) {}
        });
        // invalidate myMessages cache so next entry sees new message; also patch if already loaded
        if (myMessagesLoaded.value) {
          // optimistic append to my list if we can guess target info
          const targetInfo = c;
          myMessagesList.value = [{
            id: realId || tempId,
            target_openid: c.openid,
            target_nickname: c.nickname || targetInfo.nickname || '未知用户',
            target_avatar: (c.photo || (c.photos && c.photos[0]) || ''),
            content: savedText,
            parent_id: parentId,
            created_at: now,
          }, ...myMessagesList.value];
        } else {
          // mark stale so next open fetches fresh
          // keep loaded false -> will fetch; do nothing
        }
      } catch (e) {
        // rollback
        messages.value = messages.value.filter(m => m.id !== tempId);
        if (cards.value[cardIndex.value]) cards.value[cardIndex.value].msg_count = messages.value.length;
        msgText.value = savedText;
        replyTarget.value = savedReply;
        if (myMessagesLoaded.value) {
          myMessagesList.value = myMessagesList.value.filter(x => x.id !== tempId && x.id !== realId);
        }
        vant.showToast(e.message || '发送失败');
      } finally {
        msgSending.value = false;
      }
    }
    async function deleteMessage(m) {
      try {
        await vant.showConfirmDialog({ title: '删除留言', message: '确定删除这条留言吗？', confirmButtonColor: '#ee0a24' });
      } catch (e) { return; }
      // optimistic: remove message + its replies (cascade) immediately
      const backup = [...messages.value];
      const backupCount = cards.value[cardIndex.value] ? cards.value[cardIndex.value].msg_count : null;
      const toDeleteIds = new Set([m.id]);
      // collect cascading replies where parent_id == m.id (backend cascade behavior)
      messages.value.forEach(msg => { if (msg.parent_id === m.id) toDeleteIds.add(msg.id); });
      messages.value = messages.value.filter(x => !toDeleteIds.has(x.id));

      try {
        await api('/api/messages/' + m.id, { method: 'DELETE' });

        // rollback
        messages.value = backup;
        if (cards.value[cardIndex.value] && backupCount !== null) cards.value[cardIndex.value].msg_count = backupCount;

      // decrement msg_count for that target card if in deck

      try {
        await api('/api/messages/' + m.id, { method: 'DELETE' });

        // rollback
        myMessagesList.value = backup;
        messages.value = msgBackup;

        cards.value.forEach(c => { if (c && c.openid && cardMsgCountBackup.has(c.openid)) c.msg_count = cardMsgCountBackup.get(c.openid); });

      gotoCards, signupSheetShow, signupList, loadingSignups, signupCache, openSignupSheet,
      userDetail, userDetailFrom, openUserDetail, loadNotifications,
      hasProfileBasic, hasProfileWork, hasProfileAbout, hasProfilePartner, hasProfileContact
    };
  }
}).use(vant).mount('#app');

    // ===== 前端新版本自动刷新（解决飞书 WebView 驻留旧 JS / 缓存问题）=====
    (function setupVersionWatch(){
      const RELOAD_COOLDOWN = 5 * 60 * 1000; // 两次自动刷新至少间隔5分钟，防止异常循环
      async function checkVersion(){
        try{
          const r = await fetch('/api/version', {cache:'no-store'});
          if(!r.ok) return;
          const d = await r.json();
          const server = String(d.version || '');
          // 占位符未被替换（本地file打开等）或版本相同则不处理
          if(!server || server === APP_VERSION || server === '__APP_VERSION__') return;
          // 用户正在输入时不打断，延后到下一次检测
          const ae = document.activeElement;
          if(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) return;
          const last = Number(sessionStorage.getItem('yxq_last_reload')||0);
          if(Date.now() - last < RELOAD_COOLDOWN) return;
          sessionStorage.setItem('yxq_last_reload', String(Date.now()));
          location.reload();
        }catch(e){ /* 静默：网络抖动不影响使用 */ }
      }
      setInterval(checkVersion, 45000);                 // 每45秒轮询一次
      document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkVersion(); });
      window.addEventListener('focus', checkVersion);
    })();
</script>
