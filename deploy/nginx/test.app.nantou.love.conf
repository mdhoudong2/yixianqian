# test.app.nantou.love - H5网页版（测试服）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name test.app.nantou.love;

    ssl_certificate /etc/letsencrypt/live/test.app.nantou.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.app.nantou.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # 公开页已迁移至 test.nantou.love 根路径
    location = /public.html {
        return 301 https://test.nantou.love/;
    }

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name test.app.nantou.love;

    location /.well-known/acme-challenge/ {
        root /var/www/nantou.love;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
