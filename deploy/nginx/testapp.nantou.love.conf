# testapp.nantou.love - H5网页版（测试服，经Cloudflare代理，proxy -> 8092 develop 后端）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name testapp.nantou.love;

    ssl_certificate /etc/letsencrypt/live/testapp.nantou.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testapp.nantou.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS：强制浏览器走 HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 20M;

    # 引流埋点限流：同 IP 5次/秒，突发 10
    # 静态资源长缓存：lib、js/css、图片等 7天
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML 不缓存，确保前端更新及时
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0";
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/track {
        limit_req zone=track burst=10 nodelay;
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公开页已迁移至 test.nantou.love 根路径
    location = /public.html {
        return 301 https://test.nantou.love/;
    }

    # H5 应用（测试服 H5，走 CF 加速）
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name testapp.nantou.love;

    location /.well-known/acme-challenge/ {
        root /var/www/nantou.love;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
