name: check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 语法检查（py_compile，不依赖第三方库）
        run: python -m compileall -q bot web scripts lib

      - name: 内联模板检查（自闭合非 void 标签吞兄弟节点，零依赖）
        run: python3 scripts/dev/check_inline_template.py

      - name: 内联 JS 重名函数检查（后声明静默覆盖同名实现，零依赖）
        run: python3 scripts/dev/check_duplicate_functions.py

      - name: 模板绑定曝光检查（setup return 漏放绑定会静默失效，零依赖）
        run: python3 scripts/dev/check_template_bindings.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            bot/requirements.txt
            web/backend/requirements.txt
      - name: 安装 ruff
        run: pip install -q "ruff==0.16.4"
      - name: 风格检查（ruff）
        run: ruff check bot web lib --output-format=github

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            bot/requirements.txt
            web/backend/requirements.txt
      - name: 安装依赖（pytest + 项目运行时）
        run: |
          pip install -q pytest
          pip install -q -r bot/requirements.txt -r web/backend/requirements.txt
      - name: 单测（分片 ${{ matrix.shard }}/4，独立 runner）
        run: |
          set -uo pipefail
          if [ ! -d tests ]; then
            echo "无单测，跳过"
            exit 0
          fi
          SHARD=${{ matrix.shard }}
          SHARDS=4
          # 动态发现，递归 tests/（排除 __pycache__），新增测试文件必被纳入，绝不硬编码。
          # 按文件行数降序做 LPT 轮转分片：重文件交错到不同分片，避免全堆一片
          # （旧版按文件名轮转 + 单 runner 4 进程，曾出现 3 片各 <15s、1 片 215s 的失衡）。
          mapfile -t FILES < <(find tests -name 'test_*.py' -not -path '*/__pycache__/*' -print0 | xargs -0 wc -l | sort -rn | awk 'NF==2 && $2!="total"{print $2}')
          total=${#FILES[@]}
          [ "$total" -ge "$SHARDS" ] || SHARDS=$total
          subset=()
          for ((j=SHARD;j<total;j+=SHARDS)); do subset+=("${FILES[j]}"); done
          if [ "${#subset[@]}" -eq 0 ]; then
            echo "本分片无文件，跳过"
            exit 0
          fi
          echo "分片 $SHARD：${#subset[@]} 个文件 / 共 $total 个"
          pytest -q "${subset[@]}"
